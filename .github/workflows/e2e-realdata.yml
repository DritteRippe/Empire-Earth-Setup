# Real-data end-to-end test of the v2 setups on a GitHub-hosted Windows runner (README.md, "End-to-end
# test on Windows"; docs/TEST-PLAN.de.md, section 12).
#
# The job downloads the two OFFICIAL setups 1.7.2 and the pinned dgVoodoo archive (public downloads,
# cached unchanged; the URL, SHA-256 and size of the archive are those of pins/dgvoodoo.txt), extracts them
# with innoextract 1.10-dev (built here with MSYS2, the binary is cached), puts their files where the
# build reads them (ci/e2e/assets-map.tsv: paths, sizes, SHA-1 values, times; no content), builds the
# real-data installers with Inno Setup 6.2.2, blocks every server of the setups in the hosts file and
# runs the scenarios A, B, E, D and C (ci/e2e/run_e2e.ps1): silent installations, updates, repairs and
# uninstallations with the checks of the contract, and the launcher core of the launcher fork against
# each installation. The job is red if any check fails.
#
# Game data never leaves the runner: the extracted files, the placed asset folders and the built
# installers are never committed, cached, uploaded or printed. Only three caches exist (the unchanged
# official setups, the unchanged dgVoodoo archive and innoextract.exe), each saved explicitly by path; the only upload is the report
# folder (logs, NUnit results, report), and ci/e2e/guard_upload.py refuses it unless it holds small
# text files only, none of them a file of the map.
#
# When it runs (README.md, "End-to-end test on Windows"; ADR 0011, amendment 2026-10-07): by hand only
# (Actions > E2E real data > Run workflow), not for pull requests. r2.empireearth.eu, where the two
# official setups come from, answers GitHub runners with HTTP 403 (an external block, not a bug in the
# job), so a check on pull requests would be red on every run, and a check that is always red trains
# people to ignore red checks. When the server lets GitHub runners download again, switch the job back
# to pull requests from branches of this repository with the label e2e (the trigger, the paths filter
# and the conditions of the old version are in the git history of this file and described in ADR 0011,
# decision 1 and the amendment, which also records this plan). Every run takes about two hours and
# downloads the localized files of one language from the community mirror. The repository setting
# "Require approval for all external contributors" (Settings > Actions > General) stays mandatory: a
# pull request from a fork brings its own copy of this file and could add a trigger to it.
name: E2E real data

on:
  workflow_dispatch:
    inputs:
      launcher_commit:
        description: Full commit (40 hex digits) on LAUNCHER_BRANCH of the launcher fork whose checks run; empty for LAUNCHER_COMMIT
        required: false
        default: ''

permissions:
  contents: read

# One run per ref: a newer dispatch on the same branch cancels the older one.
concurrency:
  group: e2e-realdata-${{ github.ref_name }}
  cancel-in-progress: true

env:
  OFFICIAL_EE_URL: https://r2.empireearth.eu/setup/game/EE_Setup.exe
  OFFICIAL_EE_SHA256: da66d954b7135104ac4c63adb5955f251647e7736bb915f27d3f8398d5bd2105
  OFFICIAL_NEOEE_URL: https://r2.empireearth.eu/setup/game/neo/NeoEE_Setup.exe
  OFFICIAL_NEOEE_SHA256: b84e2c0f6bf7c0e8bf4f5594b20230df252d9fc6d7649a5507d6323c2b518c33
  # innoextract 1.10-dev: 1.9 cannot read setups of Inno Setup 6.2.2
  INNOEXTRACT_COMMIT: 6e9e34ed0876014fdb46e684103ef8c3605e382e
  LAUNCHER_REPOSITORY: DritteRippe/empire-earth-launcher
  # The launcher code runs as administrator next to the game data: a full commit, reviewed and moved
  # on purpose by a commit here (never a branch), and it must lie on LAUNCHER_BRANCH (ADR 0011)
  LAUNCHER_BRANCH: main
  LAUNCHER_COMMIT: 5d256c8d98fb1d7e7509ad095c1cb1d3becbdc72
  # The real AppIds of the official setups (an update over 1.7.2 needs them)
  EE_APPID: 4C0B46D8-E7EB-4B95-97D4-A578D9B914C6
  NEOEE_APPID: A24FCC7A-5491-4FEA-837B-4E4430C349DA
  REFASM_PACKAGE: Microsoft.NETFramework.ReferenceAssemblies.net48
  REFASM_VERSION: 1.0.3

jobs:
  e2e:
    name: Install, check and uninstall the real-data setups
    runs-on: windows-latest
    # The scenario steps have their own limits (sum 275 minutes) and the scripts stop their programs
    # before those (run_e2e.ps1 -BudgetMinutes); at least 45 minutes remain for the preparation and the
    # report (ci/e2e/tests/test_e2e_tools.py)
    timeout-minutes: 330
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Game data and installers only below E2E_ROOT and in the gitignored asset folders of the
      # workspace; the report folder is separate, and the only thing uploaded
      - name: Job folders and time zone
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ee-e2e'
          $folders = [ordered]@{
            E2E_ROOT = $root
            E2E_OFFICIAL = Join-Path $root 'official'
            E2E_IX = Join-Path $root 'innoextract'
            E2E_BUILD = Join-Path $root 'build'
            E2E_WORK = Join-Path $root 'work'
            E2E_REPORT = Join-Path $env:RUNNER_TEMP 'ee-e2e-report'
          }
          foreach ($name in $folders.Keys) {
            New-Item -ItemType Directory -Force -Path $folders[$name] | Out-Null
            "$name=$($folders[$name])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          # ISCC stores the time stamps of the files in local time; the map assumes UTC
          if ((tzutil /g) -ne 'UTC') { tzutil /s 'UTC' }
          "Time zone: $(tzutil /g)"
          Get-PSDrive -PSProvider FileSystem | ForEach-Object { '{0}: {1:N1} GB free' -f $_.Name, ($_.Free / 1GB) }

      # The rules of the checks, with fake data (also in build.yml): fail fast before any download
      - name: Self-tests of the end-to-end tools
        shell: pwsh
        run: |
          python -m unittest discover -s ci/e2e/tests -p "test_*.py"
          if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File ci/e2e/tests/e2e_helpers.tests.ps1
          if ($LASTEXITCODE) { exit 1 }

      # --- The official setups 1.7.2: public downloads, cached unchanged, verified every time
      - name: Restore the official setups 1.7.2
        id: official-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ee-e2e\official
          key: ee-official-setups-1.7.2-da66d954-b84e2c0f

      - name: Download the official setups 1.7.2 (cache miss)
        if: steps.official-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          foreach ($setup in @(@{ Url = $env:OFFICIAL_EE_URL; File = 'EE_Setup.exe' }, @{ Url = $env:OFFICIAL_NEOEE_URL; File = 'NeoEE_Setup.exe' })) {
            curl.exe -fsSL --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 10 -o (Join-Path $env:E2E_OFFICIAL $setup.File) $setup.Url
            if ($LASTEXITCODE) { throw "Download of $($setup.Url) failed (curl exit code $LASTEXITCODE)" }
          }

      - name: Verify the official setups (SHA-256)
        shell: pwsh
        run: |
          $expected = @{ 'EE_Setup.exe' = $env:OFFICIAL_EE_SHA256; 'NeoEE_Setup.exe' = $env:OFFICIAL_NEOEE_SHA256 }
          foreach ($file in $expected.Keys) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $env:E2E_OFFICIAL $file) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $expected[$file]) { throw "$file has the SHA-256 $hash, expected $($expected[$file])" }
            "${file}: SHA-256 as expected"
          }
          $other = @(Get-ChildItem -LiteralPath $env:E2E_OFFICIAL -Force | Where-Object { $expected.Keys -notcontains $_.Name })
          if ($other.Count) { throw "Unexpected files next to the official setups: $($other.Name -join ', ')" }

      # Saved right away: a cache of a red job would otherwise be lost (the post step skips it)
      - name: Save the official setups (cache miss)
        if: steps.official-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ee-e2e\official
          key: ee-official-setups-1.7.2-da66d954-b84e2c0f

      # --- innoextract 1.10-dev: no Windows binary is published, so it is built once and cached
      - name: Restore innoextract
        id: innoextract-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ee-e2e\innoextract
          key: innoextract-${{ env.INNOEXTRACT_COMMIT }}-mingw64-static-r1

      - name: Check out innoextract (cache miss)
        if: steps.innoextract-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dscharrer/innoextract
          ref: ${{ env.INNOEXTRACT_COMMIT }}
          path: _innoextract-src
          persist-credentials: false

      - name: Set up MSYS2 (cache miss)
        if: steps.innoextract-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          # no cache of its own: only the two caches above exist
          cache: false
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-boost
            mingw-w64-x86_64-xz mingw-w64-x86_64-zlib mingw-w64-x86_64-bzip2 mingw-w64-x86_64-zstd

      # A static binary: only system DLLs (without the bzip2 override FindBZip2 links libbz2.dll.a;
      # -static also drops libwinpthread-1.dll)
      - name: Build innoextract (cache miss)
        if: steps.innoextract-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S _innoextract-src -B _ixb -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_STATIC_LIBS=ON -DUSE_LTO=OFF \
            -DCMAKE_EXE_LINKER_FLAGS='-static -s' -DBZIP2_LIBRARY_RELEASE=/mingw64/lib/libbz2.a
          cmake --build _ixb
          objdump -p _ixb/innoextract.exe | grep 'DLL Name' | tee _ixb/dlls.txt
          grep -q 'KERNEL32.dll' _ixb/dlls.txt
          if grep -viE 'DLL Name: (KERNEL32|msvcrt|SHELL32)\.dll$' _ixb/dlls.txt; then
            echo "innoextract.exe needs more than system DLLs"
            exit 1
          fi
          pacman -Q mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-boost mingw-w64-x86_64-xz \
            mingw-w64-x86_64-zlib mingw-w64-x86_64-bzip2 mingw-w64-x86_64-zstd
          cp _ixb/innoextract.exe "$(cygpath -u "$E2E_IX")/"

      - name: Save innoextract (cache miss)
        if: steps.innoextract-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ee-e2e\innoextract
          key: innoextract-${{ env.INNOEXTRACT_COMMIT }}-mingw64-static-r1

      - name: innoextract version
        shell: pwsh
        run: |
          $version = & (Join-Path $env:E2E_IX 'innoextract.exe') --version | Select-Object -First 1
          "innoextract: $version"
          if ($version -notmatch '^innoextract 1\.10-dev') { throw "innoextract 1.10-dev expected, found $version" }
          "E2E_INNOEXTRACT=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # --- dgVoodoo: the third public download (ADR 0011, amendment 2026-10-07). The URL, the SHA-256 and the size
      # come from pins/dgvoodoo.txt, never from this file; the archive is cached by its SHA-256, verified every
      # time and extracted below E2E_ROOT. Its three files are in the asset map (origin download:<name>).
      - name: Read the dgVoodoo pin
        id: dgvoodoo
        shell: pwsh
        run: |
          . ./ci/build_helpers.ps1
          $pins = Read-DgVoodooPins 'pins/dgvoodoo.txt'
          "url=$($pins.Archive.Url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$($pins.Archive.Sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$($pins.Archive.Size)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=dgvoodoo-$($pins.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "dgVoodoo $($pins.Version): $($pins.Archive.Url)"

      - name: Restore the dgVoodoo archive
        id: dgvoodoo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ee-e2e\dgvoodoo-zip
          key: dgvoodoo-${{ steps.dgvoodoo.outputs.sha256 }}

      - name: Download the dgVoodoo archive (cache miss)
        if: steps.dgvoodoo-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          DGVOODOO_URL: ${{ steps.dgvoodoo.outputs.url }}
        run: |
          $folder = Join-Path $env:E2E_ROOT 'dgvoodoo-zip'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          curl.exe -fsSL --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 10 -o (Join-Path $folder 'dgvoodoo.zip') $env:DGVOODOO_URL
          if ($LASTEXITCODE) { throw "Download of $env:DGVOODOO_URL failed (curl exit code $LASTEXITCODE)" }

      - name: Verify the dgVoodoo archive (SHA-256 and size of pins/dgvoodoo.txt)
        shell: pwsh
        env:
          DGVOODOO_SHA256: ${{ steps.dgvoodoo.outputs.sha256 }}
          DGVOODOO_SIZE: ${{ steps.dgvoodoo.outputs.size }}
        run: |
          $folder = Join-Path $env:E2E_ROOT 'dgvoodoo-zip'
          $file = Join-Path $folder 'dgvoodoo.zip'
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "$file is missing" }
          $size = (Get-Item -LiteralPath $file).Length
          if ("$size" -ne $env:DGVOODOO_SIZE) { throw "The dgVoodoo archive has $size bytes, pins/dgvoodoo.txt pins $env:DGVOODOO_SIZE" }
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:DGVOODOO_SHA256) { throw "The dgVoodoo archive has the SHA-256 $hash, pins/dgvoodoo.txt pins $env:DGVOODOO_SHA256" }
          "dgvoodoo.zip: SHA-256 and size as pinned"
          $other = @(Get-ChildItem -LiteralPath $folder -Force | Where-Object { $_.Name -ne 'dgvoodoo.zip' })
          if ($other.Count) { throw "Unexpected files next to the dgVoodoo archive: $($other.Name -join ', ')" }

      - name: Save the dgVoodoo archive (cache miss)
        if: steps.dgvoodoo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ee-e2e\dgvoodoo-zip
          key: dgvoodoo-${{ steps.dgvoodoo.outputs.sha256 }}

      - name: Extract the dgVoodoo archive
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath (Join-Path $env:E2E_ROOT 'dgvoodoo-zip\dgvoodoo.zip') -DestinationPath (Join-Path $env:E2E_ROOT 'dgvoodoo') -Force

      # --- The launcher's checks against a real installation (Empire-Earth-Launcher.RealMachineTests),
      # built before the game data exists so that a failure shows early. Only a full commit (the pin
      # LAUNCHER_COMMIT, or one given by hand): no branch, tag or pull request ref
      - name: Choose the launcher commit
        id: launcher
        shell: pwsh
        env:
          REQUESTED_COMMIT: ${{ inputs.launcher_commit }}
        run: |
          $commit = $env:LAUNCHER_COMMIT
          if ($env:REQUESTED_COMMIT) { $commit = $env:REQUESTED_COMMIT.Trim() }
          if ($commit -cnotmatch '^[0-9a-f]{40}$') {
            throw "The launcher commit must be a full commit (40 lowercase hex digits), not a branch, tag or pull request ref: '$commit'"
          }
          "Launcher commit: $commit"
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The whole history (a few MB), to prove that the commit is on LAUNCHER_BRANCH
      - name: Check out the launcher fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LAUNCHER_REPOSITORY }}
          ref: ${{ steps.launcher.outputs.commit }}
          path: _launcher
          fetch-depth: 0
          persist-credentials: false

      # A commit of the fork network that is not on the branch (e.g. of a foreign pull request) is refused
      - name: Check that the launcher commit is on its branch
        shell: pwsh
        working-directory: _launcher
        env:
          EXPECTED_COMMIT: ${{ steps.launcher.outputs.commit }}
        run: |
          $head = git rev-parse HEAD
          if ($head -cne $env:EXPECTED_COMMIT) { throw "Checked out $head, expected $env:EXPECTED_COMMIT" }
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$env:LAUNCHER_BRANCH"
          if ($LASTEXITCODE -eq 1) { throw "$head is not on the branch $env:LAUNCHER_BRANCH of $env:LAUNCHER_REPOSITORY" }
          if ($LASTEXITCODE) { throw "git merge-base failed (exit code $LASTEXITCODE)" }
          "$head is on $env:LAUNCHER_BRANCH of $env:LAUNCHER_REPOSITORY"

      - name: Set up NuGet
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build the launcher's real-machine checks and run their self-tests
        shell: pwsh
        working-directory: _launcher
        run: |
          nuget restore Empire-Earth.sln -NonInteractive
          if ($LASTEXITCODE) { exit 1 }
          nuget install $env:REFASM_PACKAGE -Version $env:REFASM_VERSION -OutputDirectory "$env:RUNNER_TEMP\refasm" -NonInteractive
          if ($LASTEXITCODE) { exit 1 }
          $root = Join-Path $env:RUNNER_TEMP "refasm\$env:REFASM_PACKAGE.$env:REFASM_VERSION\build"
          msbuild Empire-Earth-Launcher.RealMachineTests\Empire-Earth-Launcher.RealMachineTests.csproj /nologo /v:minimal /p:Configuration=Release `
            "/p:TargetFrameworkRootPath=$root" "/p:FrameworkPathOverride=$root\.NETFramework\v4.8"
          if ($LASTEXITCODE) { exit 1 }
          $exe = (Resolve-Path 'Empire-Earth-Launcher.RealMachineTests\bin\Release\Empire-Earth-Launcher.RealMachineTests.exe').Path
          & $exe --where "cat == SelfTest"
          if ($LASTEXITCODE) { exit 1 }
          "LAUNCHER_RM=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "E2E_LAUNCHER_COMMIT=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # --- Game data: only in the job workspace (gitignored asset folders) and below E2E_ROOT
      - name: Extract the official setups and place their files
        shell: pwsh
        env:
          DGVOODOO_NAME: ${{ steps.dgvoodoo.outputs.name }}
        run: |
          $ix = Join-Path $env:E2E_IX 'innoextract.exe'
          foreach ($product in 'EE', 'NeoEE') {
            $setup = Join-Path $env:E2E_OFFICIAL "${product}_Setup.exe"
            # -q: no file list in the job log
            & $ix -e --collisions=rename-all -q -c 0 -p 0 -d (Join-Path $env:E2E_ROOT "x\$product") $setup
            if ($LASTEXITCODE) { throw "innoextract failed for $product (exit code $LASTEXITCODE)" }
            python ci/e2e/inno_headers.py $setup (Join-Path $env:E2E_ROOT "hd\$product")
            if ($LASTEXITCODE) { throw "inno_headers.py failed for $product" }
          }
          python ci/e2e/place_assets.py --map ci/e2e/assets-map.tsv --root . `
            --extract "EE=$env:E2E_ROOT\x\EE" "NeoEE=$env:E2E_ROOT\x\NeoEE" --headers "EE=$env:E2E_ROOT\hd\EE" "NeoEE=$env:E2E_ROOT\hd\NeoEE" `
            --download "$env:DGVOODOO_NAME=$env:E2E_ROOT\dgvoodoo"
          $code = $LASTEXITCODE
          Remove-Item -LiteralPath (Join-Path $env:E2E_ROOT 'x'), (Join-Path $env:E2E_ROOT 'hd') -Recurse -Force
          if ($code) { throw 'The official files could not be placed (PROBLEM lines above)' }

      - name: Install Inno Setup 6.2.2
        shell: pwsh
        run: choco install innosetup --version=6.2.2 --allow-downgrade --no-progress -y

      # Release build (TestID 0), Regular, the real AppIds, unsigned (no -SignSetup: certinclude is
      # not compiled in); SetupBuild is the short commit in CI
      - name: Build the real-data setups
        shell: pwsh
        run: |
          ./ci/build.ps1 -Variants EE/Regular, NeoEE/Regular -EEAppID $env:EE_APPID -NeoEEAppID $env:NEOEE_APPID -TestID 0 `
            -RequireVersion 6.2.2 -OutputDir $env:E2E_BUILD -KeepPreprocessed (Join-Path $env:E2E_ROOT 'pp')
          if ($LASTEXITCODE) { exit 1 }

      # Map drift: what the scripts read must be exactly the map, and the pin list the build wrote
      # must be the one of the map
      - name: Check the build inputs against the map
        shell: pwsh
        run: |
          python ci/e2e/readset.py --root . --pp "EE=$env:E2E_ROOT\pp\EE_Regular.iss" --pp "NeoEE=$env:E2E_ROOT\pp\NeoEE_Regular.iss" --check-map ci/e2e/assets-map.tsv
          if ($LASTEXITCODE) { exit 1 }
          python ci/e2e/place_assets.py --map ci/e2e/assets-map.tsv --root . --verify-only
          if ($LASTEXITCODE) { exit 1 }
          $text = [IO.File]::ReadAllText((Join-Path (Get-Location) 'data\localized-text.sha256')).Replace("`r`n", "`n")
          $sha1 = [BitConverter]::ToString([Security.Cryptography.SHA1]::Create().ComputeHash([Text.Encoding]::ASCII.GetBytes($text))).Replace('-', '').ToLowerInvariant()
          $row = (Get-Content -LiteralPath ci/e2e/assets-map.tsv | Where-Object { $_ -like "generated`t*" }) -split "`t"
          if ($sha1 -ne $row[3]) { throw 'data\localized-text.sha256 differs from the map (SHA-1 of its LF form)' }
          "E2E_PIN_COUNT=$(@($text.Split("`n") | Where-Object { $_ }).Count)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "E2E_SETUP_BUILD=$(git rev-parse --short=7 HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # --- The scenarios (Windows PowerShell 5.1). Prepare blocks every server in the hosts file
      # (api.empireearth.eu with the statistics endpoints first) and seeds the CD key dummy; no setup
      # runs unless it passed. Each scenario records its results and never stops the next one.
      # -BudgetMinutes is the time of the phase, 5 minutes below the step limit: the script stops a
      # program that runs into it (and every program at its own limit, setup 25 minutes, uninstaller,
      # launcher checks 10), records FAIL and still uninstalls, before GitHub would stop the step
      # (ci/e2e/tests/test_e2e_tools.py checks the numbers).
      - name: Prepare the runner (hosts block, CD key dummy, clean state)
        id: prepare
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ci/e2e/run_e2e.ps1 -Phase Prepare
          exit $LASTEXITCODE

      - name: 'Scenario A: EE for all users, German, downloads from the mirror'
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 50
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ci/e2e/run_e2e.ps1 -Phase A -BudgetMinutes 45
          exit $LASTEXITCODE

      - name: 'Scenario B: NeoEE for the current user, without the CD key task'
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 50
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ci/e2e/run_e2e.ps1 -Phase B -BudgetMinutes 45
          exit $LASTEXITCODE

      - name: 'Scenario E: custom folder next to a foreign installation'
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 35
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ci/e2e/run_e2e.ps1 -Phase E -BudgetMinutes 30
          exit $LASTEXITCODE

      - name: 'Scenario D: link guard, update without the wrapper, then with dgVoodoo'
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 50
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ci/e2e/run_e2e.ps1 -Phase D -BudgetMinutes 45
          exit $LASTEXITCODE

      - name: 'Scenario C: official 1.7.2, v2 over it, damage and repair'
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 90
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ci/e2e/run_e2e.ps1 -Phase C -BudgetMinutes 85
          exit $LASTEXITCODE

      # --- Report and the one upload (logs and report only)
      - name: Remove the game data, the installers and the work folder
        if: always()
        shell: pwsh
        run: |
          $paths = @('data', 'internal\media', 'internal\misc', 'internal\runtime', $env:E2E_BUILD, $env:E2E_WORK)
          if ($env:E2E_ROOT) { $paths += @('x', 'hd', 'pp', 'dgvoodoo' | ForEach-Object { Join-Path $env:E2E_ROOT $_ }) }
          foreach ($path in $paths) {
            if ($path -and (Test-Path -LiteralPath $path)) { Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Continue }
          }

      - name: Report
        if: always()
        shell: pwsh
        run: |
          if (-not $env:E2E_REPORT) { 'No report folder: the job stopped before the scenarios.'; exit 0 }
          python ci/e2e/report.py --results (Join-Path $env:E2E_REPORT 'results.jsonl') --summary $env:GITHUB_STEP_SUMMARY `
            --out (Join-Path $env:E2E_REPORT 'report.md') --context "Setup-Commit / setup commit=$env:GITHUB_SHA" `
            "SetupBuild=$env:E2E_SETUP_BUILD" "Launcher=$env:LAUNCHER_REPOSITORY $env:E2E_LAUNCHER_COMMIT" `
            "innoextract=$env:E2E_INNOEXTRACT" "Runner=$env:ImageOS $env:ImageVersion"

      - name: Check the report folder before the upload
        id: guard
        if: always()
        shell: pwsh
        run: |
          if (-not $env:E2E_REPORT) { exit 1 }
          python ci/e2e/guard_upload.py --dir $env:E2E_REPORT --map ci/e2e/assets-map.tsv --forbid $env:GITHUB_WORKSPACE $env:E2E_ROOT
          exit $LASTEXITCODE

      - name: Upload logs and report (no game data)
        if: ${{ always() && steps.guard.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-realdata-report
          path: ${{ runner.temp }}\ee-e2e-report
          if-no-files-found: warn
          retention-days: 14

      - name: Verdict
        if: always()
        shell: pwsh
        run: |
          if (-not $env:E2E_REPORT) { exit 1 }
          python ci/e2e/report.py --results (Join-Path $env:E2E_REPORT 'results.jsonl') --verdict
          exit $LASTEXITCODE
