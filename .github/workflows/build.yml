# Compiles all four setup variants (EE/NeoEE x Regular/Portable) against placeholder assets.
# The real game data is not in the repository, so this checks that the script compiles; the
# produced installers are useless and are deliberately not uploaded.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile all variants (placeholder assets)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The script targets Inno Setup 6.2.x; pin the version the releases are built with.
      - name: Install Inno Setup 6.2.2
        shell: pwsh
        run: choco install innosetup --version=6.2.2 --allow-downgrade --no-progress -y

      # Mistakes in messages.iss (duplicate keys, '==' typos, ...), undefined messages in the own
      # scripts and a missing BOM or a non-CRLF line end compile without a warning (or break
      # non-ASCII text). --coverage also prints the missing translations per language (a report,
      # not an error).
      - name: Check messages and own scripts
        shell: pwsh
        run: python ci/check_messages.py --coverage

      # Modified copies of the repository (e.g. a new module without BOM or with an undefined
      # message) must fail the check above, an unmodified copy must pass.
      - name: Check messages (self-test)
        shell: pwsh
        run: python ci/check_messages.py --self-test

      # docs/TEST-PLAN.de.md: unique test case ids, forum test cases 1 to 22 assigned, every id
      # named in the documentation defined; then the self-test of the check (modified copies).
      - name: Check the test plan
        shell: pwsh
        run: python ci/check_test_plan.py

      - name: Check the test plan (self-test)
        shell: pwsh
        run: python ci/check_test_plan.py --self-test

      # docs/CONTRACT.md must be identical in the launcher repository, which CI cannot reach: the
      # copy check runs locally (README, "Verify"); here only its self-test.
      - name: Contract copy check (self-test)
        shell: pwsh
        run: python ci/compare_contract.py --self-test

      # Unit tests of the [Code] helpers: a tiny test setup that only computes (no network)
      - name: Unit tests
        shell: pwsh
        run: ./ci/run_unit_tests.ps1

      # Helpers of the build script: hash list, DER copy of the signing certificate
      - name: Build script tests
        shell: pwsh
        run: ./ci/tests/build_helpers.tests.ps1

      - name: Build
        shell: pwsh
        run: ./ci/build.ps1 -Placeholders -RequireVersion 6.2.2 -KeepPreprocessed out/preprocessed

      # The resolved scripts are handy to review what a change does to each variant.
      - name: Upload preprocessed scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preprocessed-scripts
          path: out/preprocessed
          if-no-files-found: ignore
