# Compiles all four setup variants (EE/NeoEE x Regular/Portable) against placeholder assets.
# The real game data is not in the repository, so this checks that the script compiles; the
# produced installers are useless and are deliberately not uploaded.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile all variants (placeholder assets)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The script targets Inno Setup 6.2.x; pin the version the releases are built with.
      - name: Install Inno Setup 6.2.2
        shell: pwsh
        run: choco install innosetup --version=6.2.2 --allow-downgrade --no-progress -y

      # Mistakes in messages.iss (duplicate keys, '==' typos, ...), undefined messages in the own
      # scripts and a missing BOM or a non-CRLF line end compile without a warning (or break
      # non-ASCII text). --coverage also prints the missing translations per language (a report,
      # not an error).
      - name: Check messages and own scripts
        shell: pwsh
        run: python ci/check_messages.py --coverage

      # Modified copies of the repository (e.g. a new module without BOM or with an undefined
      # message) must fail the check above, an unmodified copy must pass.
      - name: Check messages (self-test)
        shell: pwsh
        run: python ci/check_messages.py --self-test

      # docs/TEST-PLAN.de.md: unique test case ids, a status and a priority per case, the P1 short
      # run (exactly the P1 cases, at most three hours), forum test cases 1 to 22 assigned, every id
      # named in the documentation defined; then the self-test of the check (modified copies).
      - name: Check the test plan
        shell: pwsh
        run: python ci/check_test_plan.py

      - name: Check the test plan (self-test)
        shell: pwsh
        run: python ci/check_test_plan.py --self-test

      # The tables of docs/CONTRACT.md (header, the publishers of 0, 2.4, 3.2, 3.3, 3.4, 3.7) must
      # match the script, the source of truth, and every [Files] entry below {app} must have
      # ignoreversion and none of onlyifdoesntexist, promptifolder, confirmoverwrite (contract 2.3);
      # then the self-test of the check (modified copies that must fail).
      - name: Check the contract against the script
        shell: pwsh
        run: python ci/check_contract.py

      - name: Check the contract against the script (self-test)
        shell: pwsh
        run: python ci/check_contract.py --self-test

      # docs/CONTRACT.md must be identical in the launcher repository, which CI cannot reach: the
      # copy check runs locally (README, "Verify"); here only its self-test.
      - name: Contract copy check (self-test)
        shell: pwsh
        run: python ci/compare_contract.py --self-test

      # Unit tests of the [Code] helpers: a tiny test setup that only computes (no network)
      - name: Unit tests
        shell: pwsh
        run: ./ci/run_unit_tests.ps1

      # Helpers of the build script: hash list, DER copy of the signing certificate, SHA-256 files
      # of the setups, the online files without a pin (read from setup_is6.iss), dry runs of
      # ci/build.ps1 with a fake ISCC
      - name: Build script tests
        shell: pwsh
        run: ./ci/tests/build_helpers.tests.ps1

      # Tools of the real-data end-to-end test (.github/workflows/e2e-realdata.yml) with made-up
      # data: header extraction, placing the official files, the read set of the build against the
      # map, the upload guard, the report and the rules of the checks (in Windows PowerShell 5.1,
      # which runs the scenarios). No game data, no installer runs here.
      - name: End-to-end test tools (self-test)
        shell: pwsh
        run: |
          python -m unittest discover -s ci/e2e/tests -p "test_*.py"
          if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File ci/e2e/tests/e2e_helpers.tests.ps1
          if ($LASTEXITCODE) { exit 1 }

      # A release build (TestID 0): it also reads the online files without a pin from the code of
      # RegisterOnlineFiles and stops if it cannot (with placeholders it only prints the number)
      - name: Build
        shell: pwsh
        run: ./ci/build.ps1 -Placeholders -RequireVersion 6.2.2 -KeepPreprocessed out/preprocessed

      # The ISPP interpreter of the contract check must read [Registry] exactly as ISCC did for
      # every variant (with the SetupBuild that build.ps1 passed in CI, the short commit, which the
      # check reads from the install record), and the fully expanded [Files] sections must pass
      # its lint as well
      - name: Contract check against the preprocessed scripts
        shell: pwsh
        run: python ci/check_contract.py --preprocessed out/preprocessed

      # The resolved scripts are handy to review what a change does to each variant.
      - name: Upload preprocessed scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preprocessed-scripts
          path: out/preprocessed
          if-no-files-found: ignore
